[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hop-core"
version = "0.1.0"
description = "Heretto Open Projects - Core platform for agentic applications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "cryptography>=41.0",
    "authlib>=1.3",
    "slowapi>=0.1.9",
    "email-validator>=2.1",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
