name: Publish hop-ui package

# Builds the @heretto/hop-ui Angular library and attaches the npm-installable
# tarball to a GitHub release. The auto-generated source archive GitHub adds to
# every release is NOT npm-installable (its root is <repo>-<version>/ rather than
# package/, and it carries no ng-packagr output), so downstream apps need this
# artifact to depend on the library by URL.

on:
  release:
    types: [published]
  # Allows attaching the tarball to a release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the package to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # Resolve the tag and confirm every version source agrees with it, before any
  # expensive work runs. The Python package and the UI library share one tag, and
  # v0.1.1 shipped reporting 0.1.0 because only ui/package.json was checked.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Resolve target tag
        id: target
        run: echo "tag=${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Verify every version source matches the release tag
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          tag_version="${TAG#v}"
          mismatch=0

          # Read a version without letting a missing or malformed file dump a
          # stack trace into the log; absence is reported as a mismatch below.
          json_version() {
            [ -f "$1" ] || return 0
            node -p "require('./$1').version || ''" 2>/dev/null || true
          }
          grep_version() {  # $1 = key, $2 = file
            [ -f "$2" ] || return 0
            sed -n "s/^$1 = \"\(.*\)\"/\1/p" "$2" 2>/dev/null | head -1
          }

          # Report every disagreement, not just the first, so one commit fixes all.
          check() {
            if [ -z "$2" ]; then
              echo "::error::$1 is missing or unreadable (expected version \"$tag_version\")"
              mismatch=1
            elif [ "$2" = "$tag_version" ]; then
              echo "  ok   $1 = $2"
            else
              echo "::error::$1 is \"$2\" but the release tag is $TAG (expected \"$tag_version\")"
              mismatch=1
            fi
          }

          check "ui/package.json"      "$(json_version ui/package.json)"
          check "ui/package-lock.json" "$(json_version ui/package-lock.json)"
          check "pyproject.toml"       "$(grep_version version pyproject.toml)"
          check "hop_core.__version__" "$(grep_version __version__ src/hop_core/__init__.py)"

          if [ "$mismatch" -ne 0 ]; then
            echo "::error::Version sources disagree with the tag. Bump them together in one commit before tagging: the tarball filename and the package metadata both derive from these, and consumers pin the resulting URL."
            exit 1
          fi

  # Prove the tagged source produces a package an external app can actually
  # consume, before anything is attached to the release. Publishing a broken
  # tarball is worse than failing the release: consumers pin the URL.
  verify:
    needs: resolve
    uses: ./.github/workflows/verify-package.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  package:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm ci so the published tarball is built from pinned tool versions.
      - name: Install build dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: Build library
        working-directory: ui
        run: npm run build

      - name: Pack npm tarball
        id: pack
        working-directory: ui/dist/hop-ui
        run: |
          filename="$(npm pack --json | jq -r '.[0].filename')"
          echo "path=ui/dist/hop-ui/$filename" >> "$GITHUB_OUTPUT"
          echo "Packed $filename"

      - name: Attach tarball to release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "${{ steps.pack.outputs.path }}" --clobber --repo "$GITHUB_REPOSITORY"
